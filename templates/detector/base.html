<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Content Moderator{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: 700;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        .severity-safe {
            background-color: #d4edda;
            color: #155724;
            border-color: #c3e6cb;
        }
        .severity-mild {
            background-color: #fff3cd;
            color: #856404;
            border-color: #ffeeba;
        }
        .severity-moderate {
            background-color: #ffe5d0;
            color: #cc4400;
            border-color: #ffd4b3;
        }
        .severity-severe {
            background-color: #f8d7da;
            color: #721c24;
            border-color: #f5c6cb;
        }
        .badge-category {
            font-size: 0.85rem;
            margin-right: 0.25rem;
            margin-bottom: 0.25rem;
        }
        .flagged-term {
            background-color: #ffc107;
            color: #212529;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            margin-right: 0.25rem;
            margin-bottom: 0.25rem;
            display: inline-block;
            font-family: monospace;
        }
        .confidence-bar {
            height: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'detector:home' %}">
                <i class="bi bi-shield-check"></i> Content Moderator
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'detector:home' %}">
                            <i class="bi bi-search"></i> Analyze
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'detector:history' %}">
                            <i class="bi bi-clock-history"></i> History
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-light py-3 mt-auto">
        <div class="container text-center">
            <small>Offensive & Abusive Content Detection powered by spaCy NLP</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
